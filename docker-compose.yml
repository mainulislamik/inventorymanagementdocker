# StockWhisk — full stack. One command:  docker compose up -d --build
# Copy deploy/docker/.env.docker.example -> .env and fill in SECRET_KEY etc.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockwhisk
      POSTGRES_USER: stockwhisk
      POSTGRES_PASSWORD: stockwhisk_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockwhisk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: ["gunicorn", "-c", "deploy/gunicorn.conf.py", "config.wsgi:application"]
    environment:
      GUNICORN_BIND: "0.0.0.0:8000"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DB_ENGINE: postgres
      DB_NAME: stockwhisk
      DB_USER: stockwhisk
      DB_PASSWORD: stockwhisk_password
      SECRET_KEY: django-insecure-default-key-for-zero-config
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1,https://stockwhisk.com,https://www.stockwhisk.com"
      SECURE_SSL_REDIRECT: "False"
      WEB_CONCURRENCY: "2"
      GUNICORN_THREADS: "4"
      DB_CONN_MAX_AGE: "600"
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DB_ENGINE: postgres
      DB_NAME: stockwhisk
      DB_USER: stockwhisk
      DB_PASSWORD: stockwhisk_password
      SECRET_KEY: django-insecure-default-key-for-zero-config
      DEBUG: "False"
      DB_CONN_MAX_AGE: "600"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  beat:
    build: .
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DB_ENGINE: postgres
      DB_NAME: stockwhisk
      DB_USER: stockwhisk
      DB_PASSWORD: stockwhisk_password
      SECRET_KEY: django-insecure-default-key-for-zero-config
      DEBUG: "False"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  static:
  media:
  caddy_data:
  caddy_config:
